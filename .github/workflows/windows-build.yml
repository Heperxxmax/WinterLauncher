name: Windows build
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Windows x64 installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application starts
        run: npm run test:smoke
      - name: Package standalone application folder
        shell: pwsh
        run: Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath 'dist/UKRAINE-ONLINE-Windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            dist/*Setup*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/UKRAINE-ONLINE-Windows-x64.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*Setup*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/UKRAINE-ONLINE-Windows-x64.zip
