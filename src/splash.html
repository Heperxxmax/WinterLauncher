<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>WINTER GTA</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      -webkit-app-region: drag;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      filter: drop-shadow(0 0 22px rgba(58, 168, 255, 0.55));
      animation: float 2.4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .title {
      font-family: "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f2f5fb;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin: 0;
    }

    .loader-track {
      width: 160px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      position: relative;
    }

    .loader-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(58, 168, 255, 0), #3aa8ff, rgba(58, 168, 255, 0));
      animation: slide 1.3s ease-in-out infinite;
    }

    @keyframes slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash-content">
      <img class="logo" src="assets/icon.png" alt="" />
      <p class="title">WINTER GTA</p>
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
    </div>
  </div>
</body>
</html>
